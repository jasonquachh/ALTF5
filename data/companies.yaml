# =============================================================================
# Company sources for the internship / student-program scraper.
#
# Scope: paid internships, co-ops, and career programs (explore / discovery /
# insight / scholars / externships / research / rotational / leadership-dev,
# etc.) across many sectors — tech, fintech, healthcare & biotech (pre-med),
# consumer / marketing / media, and data & analytics. Detection is field-
# agnostic, so "Marketing Intern", "Data Analytics Intern", and "Clinical
# Research Intern" all qualify; sector coverage comes from the companies below.
#
# Roles are still filtered to US-based + paid + recent + verified-applyable by
# the pipeline, so a broad company list here is safe.
#
# ATS types:  greenhouse -> boards.greenhouse.io/<token>
#             lever      -> jobs.lever.co/<token>
#             ashby      -> jobs.ashbyhq.com/<token>
#             workday    -> host/tenant/site from myworkdayjobs.com
#
# A wrong slug just logs a 404 and is skipped (shown in the run summary's
# "errors" list), so it is safe to leave entries in and prune later.
# =============================================================================

