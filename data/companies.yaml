# =============================================================================
# Company sources for the internship / student-program scraper.
#
# Scope: paid internships, co-ops, and career programs (explore / discovery /
# insight / scholars / externships / research / rotational / leadership-dev)
# across tech, fintech, healthcare & biotech (pre-med), consumer / marketing /
# media, and data & analytics. Detection is field-agnostic, so marketing,
# data-analytics, and clinical/pre-med intern titles all qualify.
#
# Roles are filtered to US-based + paid + recent + verified-applyable.
# A wrong slug just logs a 404 and is skipped (shown in the run summary), so it
# is safe to leave entries in and prune later. The list below has had known
# 404 slugs removed; remaining entries fetched successfully in a recent run.
#
# ATS types:  greenhouse -> boards.greenhouse.io/<token>
#             lever      -> jobs.lever.co/<token>
#             ashby      -> jobs.ashbyhq.com/<token>
#             workday    -> host/tenant/site from myworkdayjobs.com
# =============================================================================

