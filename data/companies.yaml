# =============================================================================
# Company sources for the internship / student-program scraper.
#
# Scope: paid internships, co-ops, and career programs (explore / discovery /
# insight / scholars / externships, etc.) at reputable companies AND startups.
# "Reputable" is curated by which companies appear in this list — add the ones
# you trust. Roles are still filtered to US-based + paid + recent + verified
# applyable by the pipeline, so a broad company list here is safe.
#
# Four ATS types are supported:
#   greenhouse   token: the slug in  boards.greenhouse.io/<token>
#   lever        token: the slug in  jobs.lever.co/<token>
#   ashby        token: the slug in  jobs.ashbyhq.com/<token>
#   workday      host/tenant/site from the company's myworkdayjobs.com URL
#
# Slugs occasionally change. A wrong slug just logs a 404 and is skipped (it
# shows up in the run summary's "errors" list), so it is safe to leave entries
# in and prune later. Set `enabled: false` to skip one without deleting it.
# =============================================================================

companies:
