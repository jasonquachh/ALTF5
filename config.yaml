# Runtime configuration for the Fortune 500 internship scraper.
# Secrets (the Discord webhook) come from the environment / .env, NOT this file.

# Path to the SQLite dedup store. Keep this file to remember what has already
# been announced across runs.
db_path: internships.db

# Verify each posting's apply URL actually loads and isn't closed before
# announcing it (the "make sure it's actually applyable" requirement).
verify_applyable: true

# Only announce roles based in the United States. Postings with no US location
# are skipped, and any foreign offices are trimmed from the displayed locations.
us_only: true

# Paid-only: skip postings that explicitly say they are unpaid / for academic
# credit. Anything with listed compensation is always kept.
exclude_unpaid: true

# College focus: de-emphasize graduate-level roles. When true, postings whose
# title targets PhD / master's / MBA / postdoc audiences are skipped so the feed
# centers on college (undergraduate) opportunities. "New grad" and rotational
# "graduate programs" (for bachelor's grads) are still included.
college_focus: true

# Discord routing: each posting is sorted into a category and sent to that
# category's channel. Channel webhooks come from these env vars / secrets:
#   DISCORD_WEBHOOK_HEALTHCARE, DISCORD_WEBHOOK_ENGINEERING,
#   DISCORD_WEBHOOK_TECH, DISCORD_WEBHOOK_BUSINESS
# DISCORD_WEBHOOK_URL is the catch-all used when a category has no webhook.

# On first run (and whenever new companies are added), announce internships
# that are already open — not just ones that open from now on.
announce_backfill: true

# Safety valve so a first run doesn't dump hundreds of old postings at once.
# Brand-new postings are NEVER subject to this cap — only backfill is.
max_backfill_per_run: 25

# Drip feed caps (0 = unlimited). max_announce_per_category takes precedence
# when > 0: it announces up to N postings PER category each run, so with the
# every-3-hours schedule each of the 4 channels receives one posting every
# 3 hours. max_announce_per_run is the older global cap (ignored when the
# per-category cap is set).
max_announce_per_run: 0
max_announce_per_category: 1

# Recency: ignore postings whose release date is older than this many days, so
# the feed stays current. Postings with no release date are kept (can't tell).
# The verifier independently guarantees each posting is still live/applyable,
# so a generous window mainly controls how "fresh" the release date must be.
only_new_since_days: 240

# Politeness delay between companies (seconds). Kept small since the list is
# large; the ATS APIs are public and lightweight.
request_delay_seconds: 0.3

# Display name the webhook posts under.
discord_username: Internship Radar

# Companies are loaded from data/companies.yaml by default. You may instead
# inline a `companies:` list here to override that file.
