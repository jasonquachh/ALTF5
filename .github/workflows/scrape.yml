name: Internship Scrape

# Runs the scraper on a schedule so newly-opened internships are announced to
# Discord automatically. The SQLite dedup store is cached between runs so a
# posting is only ever announced once.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch: {}        # allow manual runs from the Actions tab

concurrency:
  group: internship-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist the dedup DB across scheduled runs.
      - name: Restore dedup store
        uses: actions/cache@v4
        with:
          path: internships.db
          # Bump the version suffix (v2, v3, ...) any time you want to wipe the
          # dedup history and re-announce every currently-open internship.
          key: internships-db-v2-${{ github.run_id }}
          restore-keys: |
            internships-db-v2-

      - name: Run scraper
        env:
          # SECURITY: this repo is public, so this URL is visible to everyone and
          # already lives in git history. Prefer a repository secret instead:
          #   DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # and regenerate the webhook in Discord (Edit Webhook -> Copy URL).
          DISCORD_WEBHOOK_URL: https://discord.com/api/webhooks/1520384539044741193/0KnMKSkVg3-y9Gh3B4xUXMaQTjZ97d_uN5ybnAW81BbD9fjciSweVgAnTZQeYstVfbR2
        run: python -m fortune_scraper.cli run -v
