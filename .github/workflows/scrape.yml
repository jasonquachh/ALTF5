name: Internship Scrape

# Runs the scraper on a schedule so newly-opened internships are announced to
# Discord automatically. The SQLite dedup store is cached between runs so a
# posting is only ever announced once. With max_announce_per_run: 1 in
# config.yaml, the every-3-hours schedule produces up to ~8 announcements/day.

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours = up to 8 posts/day
  workflow_dispatch:
    inputs:
      reset:
        description: "Wipe dedup history and re-announce all current openings (use ONLY after clearing the Discord channel, to avoid duplicates)"
        type: boolean
        default: false
      count:
        description: "Announce this many roles this run (blank = config default of 1)"
        type: string
        default: ""
      per_category:
        description: "Announce this many roles PER category/channel this run (e.g. 1 = one to each channel)"
        type: string
        default: ""

concurrency:
  group: internship-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Persist the dedup DB across scheduled runs.
      - name: Restore dedup store
        uses: actions/cache@v4
        with:
          path: internships.db
          # Bump the version suffix (v2, v3, ...) any time you want to wipe the
          # dedup history and re-announce every currently-open internship.
          key: internships-db-v4-${{ github.run_id }}
          restore-keys: |
            internships-db-v4-

      # Manual reset: only when the workflow is dispatched with reset=true.
      # Scheduled runs never reset, so they never create duplicates.
      - name: Reset dedup store
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.reset == 'true' }}
        run: rm -f internships.db

      - name: Run scraper
        env:
          # Category channels (repo secrets). Each posting is routed to the
          # channel matching its category; DISCORD_WEBHOOK_URL is the catch-all.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_BUSINESS: ${{ secrets.discord_business }}
          DISCORD_WEBHOOK_TECH: ${{ secrets.discord_tech }}
          DISCORD_WEBHOOK_ENGINEERING: ${{ secrets.discord_engerineering }}
          DISCORD_WEBHOOK_HEALTHCARE: ${{ secrets.discord_healthcare }}
          # Per-run overrides for the drip cap; blank on scheduled runs so they
          # use the config default (1). per_category takes precedence when set.
          MAX_ANNOUNCE_PER_RUN: ${{ github.event.inputs.count }}
          MAX_ANNOUNCE_PER_CATEGORY: ${{ github.event.inputs.per_category }}
        run: python -m fortune_scraper.cli run -v

      # Spreadsheet of every queued (not-yet-pushed) program, for separate
      # viewing. Download it from this run's "Artifacts" section.
      - name: Export queued programs to CSV
        run: python -m fortune_scraper.cli export --output queued_programs.csv

      - name: Upload queued-programs spreadsheet
        uses: actions/upload-artifact@v4
        with:
          name: queued-programs
          path: queued_programs.csv
          if-no-files-found: warn
